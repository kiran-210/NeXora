name: Deploy

# Manual only — never runs automatically, so it can't break CI.
# Configure the referenced secrets in Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [frontend, contracts]
        default: frontend

jobs:
  frontend:
    name: Deploy frontend → Vercel
    if: ${{ github.event.inputs.target == 'frontend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull, build & deploy
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      # NOTE: also set USDC_ISSUER_SECRET as a Vercel project env var so the
      # /api/faucet route works in production.

  contracts:
    name: Deploy contracts → Stellar Testnet
    if: ${{ github.event.inputs.target == 'contracts' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build contracts
        run: stellar contract build

      - name: Deploy to testnet
        env:
          DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/pool.wasm \
            --source-account "$DEPLOYER_SECRET" --network testnet
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/collateral_manager.wasm \
            --source-account "$DEPLOYER_SECRET" --network testnet
